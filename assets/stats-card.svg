<svg width="100%" height="160" viewBox="0 0 900 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090E" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="barGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="barGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F87171" />
    </linearGradient>
  </defs>

  <style>
    .metric-title {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      fill: #64748B;
      text-transform: uppercase;
    }
    .metric-value {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 15px;
      font-weight: 700;
      fill: #F1F5F9;
    }
    .metric-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11.5px;
      fill: #94A3B8;
    }
    .bar-bg {
      fill: #1E293B;
      rx: 3px;
    }
    .bar-fill {
      rx: 3px;
      animation: fillBar 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes fillBar {
      0% { width: 0; }
    }
  </style>

  <!-- Background -->
  <rect x="1" y="1" width="898" height="158" rx="10" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />

  <!-- 4 Column Grid -->
  <!-- Col 1: Backend Systems -->
  <g transform="translate(30, 24)">
    <text x="0" y="14" class="metric-title">CORE BACKEND</text>
    <text x="0" y="42" class="metric-value">Python &amp; Django</text>
    <text x="0" y="62" class="metric-sub">Flask, DRF, REST APIs</text>
    <!-- Progress Indicator -->
    <rect x="0" y="80" width="180" height="6" class="bar-bg" />
    <rect x="0" y="80" width="170" height="6" fill="url(#barGrad1)" class="bar-fill" />
    <text x="0" y="104" class="metric-sub">Structured Web Platforms</text>
  </g>

  <!-- Divider 1 -->
  <line x1="240" y1="20" x2="240" y2="140" stroke="#1E293B" stroke-width="1" />

  <!-- Col 2: Relational Databases -->
  <g transform="translate(265, 24)">
    <text x="0" y="14" class="metric-title">DATABASE &amp; DATA STORE</text>
    <text x="0" y="42" class="metric-value">PostgreSQL &amp; MySQL</text>
    <text x="0" y="62" class="metric-sub">Schema Design &amp; ORM</text>
    <!-- Progress Indicator -->
    <rect x="0" y="80" width="180" height="6" class="bar-bg" />
    <rect x="0" y="80" width="160" height="6" fill="url(#barGrad2)" class="bar-fill" />
    <text x="0" y="104" class="metric-sub">Query Optimization &amp; ACID</text>
  </g>

  <!-- Divider 2 -->
  <line x1="475" y1="20" x2="475" y2="140" stroke="#1E293B" stroke-width="1" />

  <!-- Col 3: Data Science Foundations -->
  <g transform="translate(500, 24)">
    <text x="0" y="14" class="metric-title">DATA SCIENCE FOUNDATIONS</text>
    <text x="0" y="42" class="metric-value">NumPy &amp; Pandas</text>
    <text x="0" y="62" class="metric-sub">Scikit-Learn, Pipelines</text>
    <!-- Progress Indicator -->
    <rect x="0" y="80" width="180" height="6" class="bar-bg" />
    <rect x="0" y="80" width="150" height="6" fill="url(#barGrad3)" class="bar-fill" />
    <text x="0" y="104" class="metric-sub">Exploratory Data Analysis</text>
  </g>

  <!-- Divider 3 -->
  <line x1="710" y1="20" x2="710" y2="140" stroke="#1E293B" stroke-width="1" />

  <!-- Col 4: Academic Track -->
  <g transform="translate(735, 24)">
    <text x="0" y="14" class="metric-title">ACADEMIC RESEARCH</text>
    <text x="0" y="42" class="metric-value">M.Sc. Data Science</text>
    <text x="0" y="62" class="metric-sub">Marwadi University</text>
    <!-- Progress Indicator -->
    <rect x="0" y="80" width="140" height="6" class="bar-bg" />
    <rect x="0" y="80" width="130" height="6" fill="url(#barGrad4)" class="bar-fill" />
    <text x="0" y="104" class="metric-sub">BCA Foundation (2026)</text>
  </g>
</svg>
