
<svg width="100%" viewBox="0 0 1000 440"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="saffron" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#FFB52E"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>

    <radialGradient id="ambient">
      <stop offset="0%" stop-color="#A45B0A" stop-opacity=".2"/>
      <stop offset="100%" stop-color="#090806" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="beamClip">
      <rect width="1000" height="440"/>
    </clipPath>

    <clipPath id="typingClip" clipPathUnits="userSpaceOnUse">
      <rect x="348" y="325" width="0" height="30">
        <animate attributeName="width"
          values="0;0;465;465;0"
          keyTimes="0;.08;.65;.85;1"
          dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <!-- BLACK BACKGROUND -->
  <rect width="1000" height="440" fill="#090806"/>

  <!-- Saffron ambient glow -->
  <ellipse cx="500" cy="270" rx="450" ry="220"
           fill="url(#ambient)"/>

  <!-- Subtle grid -->
  <g opacity=".13" stroke="#B7791F" stroke-width="1">
    <path d="M0 35 H1000 M0 405 H1000"/>
    <path d="M60 0 V440 M940 0 V440"/>
    <path d="M0 80 H1000 M0 160 H1000 M0 240 H1000 M0 320 H1000"/>
    <path d="M140 0 V440 M220 0 V440 M780 0 V440 M860 0 V440"/>
  </g>

  <!-- Neural network left -->
  <g stroke="#D97706" stroke-opacity=".38" fill="none">
    <path d="M110 100 L205 65 L270 135 L235 210 L155 250 L100 350"/>
    <path d="M205 65 L235 210 L190 370 L100 350"/>
    <path d="M270 135 L235 210 L310 335 L190 370"/>
  </g>

  <!-- Neural network right -->
  <g stroke="#D97706" stroke-opacity=".38" fill="none">
    <path d="M890 100 L795 65 L730 135 L765 210 L845 250 L900 350"/>
    <path d="M795 65 L765 210 L810 370 L900 350"/>
    <path d="M730 135 L765 210 L690 335 L810 370"/>
  </g>

  <!-- Neural nodes -->
  <g fill="#F59E0B">
    <circle cx="110" cy="100" r="3"/>
    <circle cx="205" cy="65" r="3"/>
    <circle cx="270" cy="135" r="3"/>
    <circle cx="235" cy="210" r="4"/>
    <circle cx="155" cy="250" r="3"/>
    <circle cx="100" cy="350" r="3"/>
    <circle cx="190" cy="370" r="3"/>
    <circle cx="310" cy="335" r="3"/>

    <circle cx="890" cy="100" r="3"/>
    <circle cx="795" cy="65" r="3"/>
    <circle cx="730" cy="135" r="3"/>
    <circle cx="765" cy="210" r="4"/>
    <circle cx="845" cy="250" r="3"/>
    <circle cx="900" cy="350" r="3"/>
    <circle cx="810" cy="370" r="3"/>
    <circle cx="690" cy="335" r="3"/>
  </g>

  <!-- Animated particles -->
  <g fill="#A3E635">
    <circle cx="340" cy="80" r="2.5">
      <animate attributeName="opacity"
        values=".2;1;.2" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="750" cy="90" r="2.5">
      <animate attributeName="opacity"
        values="1;.2;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Top label -->
  <text x="500" y="75" text-anchor="middle"
        font-family="monospace" font-size="13"
        font-weight="bold" letter-spacing="6"
        fill="#FFB52E">
    [ INITIALIZING NEURAL DATA LAB ]
    <animate attributeName="opacity"
      values="1;.55;1" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- Main name -->
  <text x="500" y="160" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="58"
        font-weight="bold" letter-spacing="4"
        fill="#FFFFFF" filter="url(#glow)">
    BHAVIK
  </text>

  <text x="500" y="218" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="48"
        font-weight="bold" letter-spacing="8"
        fill="url(#saffron)" filter="url(#glow)">
    VASAVADA
  </text>

  <!-- Subtitle -->
  <text x="500" y="252" text-anchor="middle"
        font-family="monospace" font-size="15"
        letter-spacing="3" fill="#EADCC7">
    PYTHON DEVELOPER · DATA SCIENCE · AI &amp; ML
  </text>

  <!-- Terminal -->
  <rect x="275" y="278" width="450" height="100"
        rx="11" fill="#090806"
        stroke="#D97706" stroke-width="1.5"/>

  <rect x="283" y="286" width="434" height="84"
        rx="8" fill="#F59E0B" opacity=".035"/>

  <!-- Live indicator -->
  <circle cx="298" cy="302" r="4"
          fill="#A3E635" filter="url(#glow)">
    <animate attributeName="opacity"
      values="1;.3;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>

  <text x="313" y="307"
        font-family="Arial, sans-serif"
        font-size="13" font-weight="bold"
        fill="#FFB52E">
    LIVE PYTHON TERMINAL
  </text>

  <!-- Terminal prompt -->
  <text x="298" y="346"
        font-family="monospace"
        font-size="14" font-weight="bold"
        fill="#A3E635">&gt;&gt;&gt;</text>

  <!-- Typing animation -->
  <g clip-path="url(#typingClip)">
    <text x="348" y="346"
          font-family="monospace"
          font-size="14" font-weight="bold"
          fill="#FFFFFF">
      p1 = 'Tour Management System (Django)'
    </text>
  </g>

  <!-- Blinking typing cursor -->
  <rect x="348" y="333" width="9" height="17"
        rx="1" fill="#A3E635">
    <animate attributeName="x"
      values="348;348;810;810;348"
      keyTimes="0;.08;.65;.85;1"
      dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity"
      values="1;0;1;0;1"
      dur=".8s" repeatCount="indefinite"/>
  </rect>

  <!-- Animated saffron underline -->
  <rect x="250" y="399" width="500" height="2"
        rx="1" fill="#49300E"/>

  <rect x="250" y="399" width="500" height="2"
        rx="1" fill="url(#saffron)">
    <animate attributeName="width"
      values="0;500;0" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x"
      values="250;250;750" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Footer -->
  <text x="500" y="426" text-anchor="middle"
        font-family="monospace" font-size="13"
        letter-spacing="5" fill="#FFB52E">
    THINK · CODE · TRAIN · PREDICT
  </text>

  <!-- Moving saffron light -->
  <g clip-path="url(#beamClip)">
    <rect x="-250" y="0" width="100" height="440"
          fill="url(#saffron)" opacity=".12"
          transform="skewX(-20)">
      <animate attributeName="x"
        from="-300" to="1200"
        dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <defs>
    <filter id="btnGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="4"
                    flood-color="#F59E0B" flood-opacity=".3"/>
    </filter>
  </defs>

  <style>
    <![CDATA[
      .btn-label {
        font-family: Consolas, 'Courier New', monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1.3px;
        fill: #FFFFFF;
        text-anchor: middle;
        dominant-baseline: central;
      }

      .btn-prefix {
        fill: #D6A65A;
        font-weight: 400;
      }

      .btn-val {
        fill: #FFFFFF;
      }

      .pill-btn-1, .pill-btn-2, .pill-btn-3,
      .pill-btn-4, .pill-btn-5, .pill-btn-6 {
        animation: saffronFlow 6s ease-in-out infinite;
        filter: url(#btnGlow);
      }

      .pill-btn-2 { animation-delay: -1s; }
      .pill-btn-3 { animation-delay: -2s; }
      .pill-btn-4 { animation-delay: -3s; }
      .pill-btn-5 { animation-delay: -4s; }
      .pill-btn-6 { animation-delay: -5s; }

      @keyframes saffronFlow {
        0%   { stroke: #D97706; }
        25%  { stroke: #FFB52E; }
        50%  { stroke: #F97316; }
        75%  { stroke: #E8A126; }
        100% { stroke: #D97706; }
      }

      .live-dot {
        animation: dotPulse 2s ease-in-out infinite;
      }

      @keyframes dotPulse {
        0%, 100% { opacity: .4; }
        50% { opacity: 1; }
      }
    ]]>
  </style>

  <!-- BLACK BACKGROUND -->
  <rect width="900" height="96" fill="#090806"/>

  <!-- ROW 1: STATUS AND EDUCATION -->

  <!-- STATUS -->
  <g transform="translate(75, 8)">
    <rect width="230" height="34" rx="17"
          fill="#090806" stroke="#D97706"
          stroke-width="1.6" class="pill-btn-1"/>

    <circle cx="22" cy="17" r="3.5"
            fill="#A3E635" class="live-dot"/>

    <text x="124" y="17" class="btn-label">
      <tspan class="btn-prefix">STATUS: </tspan>
      <tspan class="btn-val">ACTIVELY BUILDING</tspan>
    </text>
  </g>

  <!-- FOCUS -->
  <g transform="translate(325, 8)">
    <rect width="250" height="34" rx="17"
          fill="#090806" stroke="#D97706"
          stroke-width="1.6" class="pill-btn-2"/>

    <circle cx="22" cy="17" r="3.5"
            fill="#F59E0B"/>

    <text x="134" y="17" class="btn-label">
      <tspan class="btn-prefix">FOCUS: </tspan>
      <tspan class="btn-val">M.SC DATA SCIENCE</tspan>
    </text>
  </g>

  <!-- LOCATION -->
  <g transform="translate(595, 8)">
    <rect width="230" height="34" rx="17"
          fill="#090806" stroke="#D97706"
          stroke-width="1.6" class="pill-btn-3"/>

    <circle cx="22" cy="17" r="3.5"
            fill="#F59E0B"/>

    <text x="124" y="17" class="btn-label">
      <tspan class="btn-prefix">LOCATION: </tspan>
      <tspan class="btn-val">GUJARAT, INDIA</tspan>
    </text>
  </g>

  <!-- ROW 2: CONTACT BUTTONS -->

  <!-- EMAIL -->
  <a href="mailto:bhavikmv5@gmail.com">
    <g transform="translate(160, 52)">
      <rect width="180" height="34" rx="17"
            fill="#090806" stroke="#D97706"
            stroke-width="1.6" class="pill-btn-4"/>

      <text x="90" y="17" class="btn-label">
        <tspan fill="#FFB52E">✉ </tspan>
        <tspan class="btn-prefix">CONTACT: </tspan>
        <tspan class="btn-val">EMAIL</tspan>
      </text>
    </g>
  </a>

  <!-- GITHUB -->
  <a href="https://github.com/bhavikmv">
    <g transform="translate(360, 52)">
      <rect width="180" height="34" rx="17"
            fill="#090806" stroke="#D97706"
            stroke-width="1.6" class="pill-btn-5"/>

      <text x="90" y="17" class="btn-label">
        <tspan fill="#FFB52E">⌘ </tspan>
        <tspan class="btn-prefix">GITHUB: </tspan>
        <tspan class="btn-val">FOLLOW</tspan>
      </text>
    </g>
  </a>

  <!-- LINKEDIN -->
  <a href="https://linkedin.com/in/YOUR_LINKEDIN_USERNAME">
    <g transform="translate(560, 52)">
      <rect width="180" height="34" rx="17"
            fill="#090806" stroke="#D97706"
            stroke-width="1.6" class="pill-btn-6"/>

      <text x="90" y="17" class="btn-label">
        <tspan fill="#FFB52E">✦ </tspan>
        <tspan class="btn-prefix">LINKEDIN: </tspan>
        <tspan class="btn-val">CONNECT</tspan>
      </text>
    </g>
  </a>
</svg>
