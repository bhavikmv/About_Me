<svg width="100%" height="440" viewBox="0 0 900 440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Radial Gradient (Neural Data Lab) -->
    <radialGradient id="labBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#10223A" />
      <stop offset="65%" stop-color="#081022" />
      <stop offset="100%" stop-color="#050914" />
    </radialGradient>

    <!-- Neon Glow Filter for Nodes & Heading -->
    <filter id="neonCyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="titleDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#00BFFF" flood-opacity="0.65" />
    </filter>

    <filter id="terminalGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#00BFFF" flood-opacity="0.18" />
    </filter>

    <!-- Flowing Title Gradient -->
    <linearGradient id="colorFlowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="25%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="75%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Title Mask for Gradient Flow -->
    <mask id="titleClipMask">
      <text x="450" y="160" text-anchor="middle" class="headline-mask">BHAVIK VASAVADA</text>
    </mask>

    <!-- Terminal Text Mask for Cycling Commands -->
    <mask id="terminalMask">
      <rect x="0" y="0" width="360" height="24" fill="#FFFFFF" />
    </mask>

    <!-- Sine Wave Training Boundary Pattern (Repeated for seamless scroll) -->
    <path id="sineUnit" d="M 0 350 Q 45 330, 90 350 T 180 350 T 270 350 T 360 350 T 450 350 T 540 350 T 630 350 T 720 350 T 810 350 T 900 350 T 990 350 T 1080 350" fill="none" stroke="rgba(139, 92, 246, 0.45)" stroke-width="1.8" />
  </defs>

  <style>
    /* ==================== GLOBAL FONTS ==================== */
    .mono-font {
      font-family: Consolas, 'Courier New', monospace;
    }
    .headline-font {
      font-family: Arial, -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 900;
      font-size: 46px;
      letter-spacing: 3.5px;
    }
    .headline-mask {
      font-family: Arial, -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 900;
      font-size: 46px;
      letter-spacing: 3.5px;
      fill: #FFFFFF;
    }

    /* ==================== 1. ANIMATED TITLE GRADIENT FLOW ==================== */
    .flow-rect {
      animation: colorFlow 5s linear infinite;
    }
    @keyframes colorFlow {
      0% { transform: translateX(-400px); }
      100% { transform: translateX(400px); }
    }

    /* ==================== 2. DATA POINTS STREAMING ==================== */
    .data-point-cyan {
      animation: streamLeftToRight 10s linear infinite;
    }
    .data-point-purple {
      animation: streamLeftToRight 12s linear infinite;
    }
    @keyframes streamLeftToRight {
      0% { transform: translateX(-80px); opacity: 0; }
      10% { opacity: 0.65; }
      90% { opacity: 0.65; }
      100% { transform: translateX(960px); opacity: 0; }
    }

    /* ==================== 3. TRAINING CLASSIFICATION BOUNDARY ==================== */
    .training-wave {
      animation: waveFlow 7s linear infinite;
    }
    @keyframes waveFlow {
      0% { transform: translateX(0); }
      100% { transform: translateX(-180px); }
    }

    /* ==================== 4. NEURAL NETWORK NODES & SYNAPSES ==================== */
    .node-pulse-1 {
      animation: nodePulse 3.5s ease-in-out infinite alternate;
    }
    .node-pulse-2 {
      animation: nodePulse 4.2s ease-in-out infinite alternate 1s;
    }
    .synapse-flicker-1 {
      animation: synapseFlicker 3s ease-in-out infinite alternate;
    }
    .synapse-flicker-2 {
      animation: synapseFlicker 4s ease-in-out infinite alternate 0.7s;
    }
    @keyframes nodePulse {
      0% { opacity: 0.4; r: 2px; }
      50% { opacity: 1; r: 3.2px; }
      100% { opacity: 0.5; r: 2px; }
    }
    @keyframes synapseFlicker {
      0% { opacity: 0.15; }
      50% { opacity: 0.45; }
      100% { opacity: 0.15; }
    }

    /* ==================== 5. TERMINAL COMMANDS CYCLE ==================== */
    .terminal-line {
      font-family: Consolas, 'Courier New', monospace;
      font-size: 11.5px;
      letter-spacing: 0.5px;
    }
    .cmd-cursor {
      animation: cursorBlink 0.8s step-start infinite;
    }
    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Staggered Command Transitions (6 commands cycling smoothly) */
    .cmd-step-1 { animation: cycleCmd1 15s infinite; }
    .cmd-step-2 { animation: cycleCmd2 15s infinite; }
    .cmd-step-3 { animation: cycleCmd3 15s infinite; }
    .cmd-step-4 { animation: cycleCmd4 15s infinite; }
    .cmd-step-5 { animation: cycleCmd5 15s infinite; }
    .cmd-step-6 { animation: cycleCmd6 15s infinite; }

    @keyframes cycleCmd1 {
      0%, 14% { opacity: 1; }
      16%, 100% { opacity: 0; }
    }
    @keyframes cycleCmd2 {
      0%, 15% { opacity: 0; }
      17%, 31% { opacity: 1; }
      33%, 100% { opacity: 0; }
    }
    @keyframes cycleCmd3 {
      0%, 32% { opacity: 0; }
      34%, 48% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes cycleCmd4 {
      0%, 49% { opacity: 0; }
      51%, 65% { opacity: 1; }
      67%, 100% { opacity: 0; }
    }
    @keyframes cycleCmd5 {
      0%, 66% { opacity: 0; }
      68%, 82% { opacity: 1; }
      84%, 100% { opacity: 0; }
    }
    @keyframes cycleCmd6 {
      0%, 83% { opacity: 0; }
      85%, 98% { opacity: 1; }
      100% { opacity: 0; }
    }

    /* Eyebrow & Bottom Pulse */
    .eyebrow-text {
      font-family: Consolas, monospace;
      font-size: 11px;
      letter-spacing: 4px;
      fill: #00E5FF;
      text-anchor: middle;
      opacity: 0.9;
    }
    .subtitle-text {
      font-family: Consolas, monospace;
      font-size: 13px;
      letter-spacing: 2px;
      fill: #A9C8DF;
      text-anchor: middle;
    }
    .bottom-tag {
      font-family: Consolas, monospace;
      font-size: 10px;
      letter-spacing: 3px;
      fill: #00D9FF;
      text-anchor: middle;
