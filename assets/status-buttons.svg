<svg width="100%" height="96" viewBox="0 0 900 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft Cyan Glow Filter -->
    <filter id="btnGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00E5FF" flood-opacity="0.3" />
    </filter>
  </defs>

  <style>
    <![CDATA[
    .btn-label {
      font-family: Consolas, 'Courier New', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      fill: #FFFFFF;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .btn-prefix {
      fill: #64748B;
      font-weight: 400;
    }
    .btn-val {
      fill: #FFFFFF;
    }

    /* Rounded Button Only Border with Animated Flowing Colors */
    .pill-btn-1 {
      animation: colorCycle1 6s ease-in-out infinite;
      transition: all 0.3s ease;
    }
    .pill-btn-2 {
      animation: colorCycle2 6s ease-in-out infinite;
      transition: all 0.3s ease;
    }
    .pill-btn-3 {
      animation: colorCycle3 6s ease-in-out infinite;
      transition: all 0.3s ease;
    }
    .pill-btn-4 {
      animation: colorCycle4 6s ease-in-out infinite;
      transition: all 0.3s ease;
    }
    .pill-btn-5 {
      animation: colorCycle5 6s ease-in-out infinite;
      transition: all 0.3s ease;
    }
    .pill-btn-6 {
      animation: colorCycle6 6s ease-in-out infinite;
      transition: all 0.3s ease;
    }

    @keyframes colorCycle1 {
      0%   { stroke: #00E5FF; }
      25%  { stroke: #8B5CF6; }
      50%  { stroke: #38BDF8; }
      75%  { stroke: #10B981; }
      100% { stroke: #00E5FF; }
    }
    @keyframes colorCycle2 {
      0%   { stroke: #8B5CF6; }
      25%  { stroke: #38BDF8; }
      50%  { stroke: #10B981; }
      75%  { stroke: #00E5FF; }
      100% { stroke: #8B5CF6; }
    }
    @keyframes colorCycle3 {
      0%   { stroke: #38BDF8; }
      25%  { stroke: #10B981; }
      50%  { stroke: #00E5FF; }
      75%  { stroke: #8B5CF6; }
      100% { stroke: #38BDF8; }
    }
    @keyframes colorCycle4 {
      0%   { stroke: #10B981; }
      25%  { stroke: #00E5FF; }
      50%  { stroke: #8B5CF6; }
      75%  { stroke: #38BDF8; }
      100% { stroke: #10B981; }
    }
    @keyframes colorCycle5 {
      0%   { stroke: #00E5FF; }
      25%  { stroke: #38BDF8; }
      50%  { stroke: #8B5CF6; }
      75%  { stroke: #10B981; }
      100% { stroke: #00E5FF; }
    }
    @keyframes colorCycle6 {
      0%   { stroke: #8B5CF6; }
      25%  { stroke: #10B981; }
      50%  { stroke: #00E5FF; }
      75%  { stroke: #38BDF8; }
      100% { stroke: #8B5CF6; }
    }

    .live-dot {
      animation: dotPulse 2s ease-in-out infinite;
    }
    @keyframes dotPulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    ]]>
  </style>

  <!-- ==================== ROW 1: STATUS & EDUCATION (ROUNDED BORDER ONLY) ==================== -->
  <!-- Button 1: STATUS -->
  <g transform="translate(75, 8)">
    <rect width="230" height="34" rx="17" fill="#040812" stroke="#00E5FF" stroke-width="1.6" class="pill-btn-1" />
    <circle cx="22" cy="17" r="3.5" fill="#10B981" class="live-dot" />
    <text x="124" y="17" class="btn-label">
      <tspan class="btn-prefix">STATUS: </tspan><tspan class="btn-val">ACTIVELY BUILDING</tspan>
    </text>
  </g>

  <!-- Button 2: FOCUS -->
  <g transform="translate(325, 8)">
    <rect width="250" height="34" rx="17" fill="#040812" stroke="#8B5CF6" stroke-width="1.6" class="pill-btn-2" />
    <circle cx="22" cy="17" r="3.5" fill="#8B5CF6" class="live-dot" />
    <text x="134" y="17" class="btn-label">
      <tspan class="btn-prefix">FOCUS: </tspan><tspan class="btn-val">M.SC DATA SCIENCE</tspan>
    </text>
  </g>

  <!-- Button 3: LOCATION -->
  <g transform="translate(595, 8)">
    <rect width="230" height="34" rx="17" fill="#040812" stroke="#38BDF8" stroke-width="1.6" class="pill-btn-3" />
    <circle cx="22" cy="17" r="3.5" fill="#38BDF8" class="live-dot" />
    <text x="124" y="17" class="btn-label">
      <tspan class="btn-prefix">LOCATION: </tspan><tspan class="btn-val">GUJARAT, INDIA</tspan>
    </text>
  </g>

  <!-- ==================== ROW 2: INTERACTIVE CONNECT BUTTONS ==================== -->
  <!-- Button 4: EMAIL -->
  <a href="mailto:bhavikmv5@gmail.com" target="_blank">
    <g transform="translate(160, 52)">
      <rect width="180" height="34" rx="17" fill="#040812" stroke="#10B981" stroke-width="1.6" class="pill-btn-4" />
      <text x="90" y="17" class="btn-label">
        <tspan fill="#10B981">✉ </tspan><tspan class="btn-prefix">CONTACT: </tspan><tspan class="btn-val">EMAIL</tspan>
      </text>
    </g>
  </a>

  <!-- Button 5: GITHUB -->
  <a href="https://github.com/bhavikmv" target="_blank">
    <g transform="translate(360, 52)">
      <rect width="180" height="34" rx="17" fill="#040812" stroke="#00E5FF" stroke-width="1.6" class="pill-btn-5" />
      <text x="90" y="17" class="btn-label">
        <tspan fill="#00E5FF">⌘ </tspan><tspan class="btn-prefix">GITHUB: </tspan><tspan class="btn-val">FOLLOW</tspan>
      </text>
    </g>
  </a>

  <!-- Button 6: LINKEDIN -->
  <a href="https://linkedin.com/in/YOUR_LINKEDIN_USERNAME" target="_blank">
    <g transform="translate(560, 52)">
      <rect width="180" height="34" rx="17" fill="#040812" stroke="#8B5CF6" stroke-width="1.6" class="pill-btn-6" />
      <text x="90" y="17" class="btn-label">
        <tspan fill="#8B5CF6">✦ </tspan><tspan class="btn-prefix">LINKEDIN: </tspan><tspan class="btn-val">CONNECT</tspan>
      </text>
    </g>
  </a>
</svg>

