<svg width="100%" height="250" viewBox="0 0 900 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B11" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#080B11" />
    </linearGradient>

    <!-- Subtle Radial Glow -->
    <radialGradient id="radialGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#080B11" stop-opacity="0" />
    </radialGradient>

    <!-- Border Accent Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.2" />
      <stop offset="30%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#818CF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.2" />
    </linearGradient>

    <!-- Scanning Light Bar Gradient -->
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    /* Intro and In-Out Animations */
    .fade-in {
      animation: introFade 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .slide-up {
      opacity: 0;
      animation: slideUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
    }
    .slide-up-sub {
      opacity: 0;
      animation: slideUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
    }
    .slide-up-badge {
      opacity: 0;
      animation: slideUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
    }
    .pulse-dot {
      animation: breatheInOut 2.4s ease-in-out infinite;
    }
    .scan-line {
      animation: scanSweep 6s ease-in-out infinite;
    }
    .grid-node {
      animation: nodeBreathe 4s ease-in-out infinite alternate;
    }

    @keyframes introFade {
      0% { opacity: 0; transform: scale(0.98); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes slideUp {
      0% { opacity: 0; transform: translateY(18px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes breatheInOut {
      0%, 100% { opacity: 0.35; transform: scale(0.92); }
      50% { opacity: 1; transform: scale(1.15); }
    }
    @keyframes scanSweep {
      0% { transform: translateX(-350px); opacity: 0; }
      15% { opacity: 0.8; }
      85% { opacity: 0.8; }
      100% { transform: translateX(950px); opacity: 0; }
    }
    @keyframes nodeBreathe {
      0% { opacity: 0.25; stroke-dashoffset: 0; }
      100% { opacity: 0.85; stroke-dashoffset: 20; }
    }

    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 34px;
      letter-spacing: 5px;
      fill: #F8FAFC;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 400;
      font-size: 14.5px;
      letter-spacing: 1.5px;
      fill: #38BDF8;
    }
    .meta-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 400;
      font-size: 13px;
      letter-spacing: 0.6px;
      fill: #94A3B8;
    }
    .badge-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 500;
      font-size: 11.5px;
      letter-spacing: 0.5px;
      fill: #E2E8F0;
    }
  </style>

  <!-- Container Box -->
  <rect x="1" y="1" width="898" height="248" rx="14" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5" />
  <rect x="1" y="1" width="898" height="248" rx="14" fill="url(#radialGlow)" />

  <!-- Animated Accent Top Border -->
  <rect x="1" y="1" width="898" height="2.5" fill="url(#borderGrad)" />
  <rect x="0" y="0.5" width="220" height="3" fill="url(#scanGrad)" class="scan-line" />

  <!-- Background Vector Grid Nodes (Data Science / Neural Motif) -->
  <g class="grid-node" opacity="0.4" stroke="#334155" stroke-width="0.8">
    <line x1="720" y1="40" x2="790" y2="85" />
    <line x1="790" y1="85" x2="850" y2="50" />
    <line x1="790" y1="85" x2="810" y2="160" />
    <line x1="810" y1="160" x2="870" y2="190" />
    <line x1="810" y1="160" x2="740" y2="200" />
    <line x1="720" y1="40" x2="680" y2="110" />
    <line x1="680" y1="110" x2="740" y2="200" />
  </g>
  <g fill="#38BDF8" opacity="0.65">
    <circle cx="720" cy="40" r="3" />
    <circle cx="790" cy="85" r="4" fill="#818CF8" />
    <circle cx="850" cy="50" r="2.5" />
    <circle cx="810" cy="160" r="3.5" />
    <circle cx="870" cy="190" r="3" fill="#818CF8" />
    <circle cx="740" cy="200" r="2.5" />
    <circle cx="680" cy="110" r="3" />
  </g>

  <!-- Left Symmetrical Subtle Node Pattern -->
  <g class="grid-node" opacity="0.25" stroke="#334155" stroke-width="0.7">
    <line x1="60" y1="60" x2="110" y2="100" />
    <line x1="110" y1="100" x2="80" y2="180" />
    <line x1="110" y1="100" x2="160" y2="130" />
  </g>
  <g fill="#38BDF8" opacity="0.4">
    <circle cx="60" cy="60" r="2.5" />
    <circle cx="110" cy="100" r="3" />
    <circle cx="80" cy="180" r="2.5" />
    <circle cx="160" cy="130" r="2.5" />
  </g>

  <!-- Content Group -->
  <g transform="translate(450, 0)" text-anchor="middle">
    <!-- Main Title -->
    <text x="0" y="78" class="title-text slide-up">BHAVIK VASAVADA</text>

    <!-- Subtitle Role -->
    <text x="0" y="112" class="subtitle-text slide-up-sub">PYTHON DEVELOPER &amp; DATA SCIENCE RESEARCHER</text>

    <!-- Institution and Education -->
    <text x="0" y="142" class="meta-text slide-up-sub">M.Sc. Data Science · Marwadi University | BCA Graduate</text>

    <!-- Clean Status Pill -->
    <g transform="translate(0, 168)" class="slide-up-badge">
      <rect x="-195" y="0" width="390" height="34" rx="17" fill="#0B132B" stroke="#1E293B" stroke-width="1.2" />
      <!-- Pulsing Indicator -->
      <circle cx="-168" cy="17" r="4.5" fill="#10B981" class="pulse-dot" />
      <circle cx="-168" cy="17" r="7.5" fill="#10B981" opacity="0.25" class="pulse-dot" />
      <!-- Status Text -->
      <text x="-148" y="21.5" class="badge-text" text-anchor="start">Currently building predictive systems &amp; REST APIs</text>
    </g>
  </g>
</svg>

