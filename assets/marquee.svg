<svg width="100%" height="48" viewBox="0 0 900 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Left and right gradient fade masks -->
    <linearGradient id="fadeMask" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#080B11" stop-opacity="1" />
      <stop offset="5%" stop-color="#080B11" stop-opacity="0" />
      <stop offset="95%" stop-color="#080B11" stop-opacity="0" />
      <stop offset="100%" stop-color="#080B11" stop-opacity="1" />
    </linearGradient>

    <!-- Subtitle pill border -->
    <linearGradient id="marqueeBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>

  <style>
    .marquee-track {
      display: flex;
      animation: marqueeScroll 22s linear infinite;
    }
    @keyframes marqueeScroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-980px); }
    }
    .skill-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Courier New', monospace;
      font-weight: 600;
      font-size: 11.5px;
      letter-spacing: 2px;
      fill: #94A3B8;
    }
    .accent-dot {
      fill: #38BDF8;
      font-size: 14px;
    }
  </style>

  <!-- Container Box -->
  <rect x="1" y="1" width="898" height="46" rx="8" fill="#080B11" stroke="url(#marqueeBorder)" stroke-width="1" />

  <!-- Animated Marquee Track -->
  <g class="marquee-track">
    <!-- Block 1 -->
    <text x="20" y="28" class="skill-text">
      PYTHON <tspan class="accent-dot">/</tspan> DATA SCIENCE <tspan class="accent-dot">/</tspan> DJANGO <tspan class="accent-dot">/</tspan> FLASK <tspan class="accent-dot">/</tspan> MACHINE LEARNING <tspan class="accent-dot">/</tspan> SCIKIT-LEARN <tspan class="accent-dot">/</tspan> PANDAS <tspan class="accent-dot">/</tspan> NUMPY <tspan class="accent-dot">/</tspan> POSTGRESQL <tspan class="accent-dot">/</tspan> MYSQL <tspan class="accent-dot">/</tspan> REST APIS <tspan class="accent-dot">/</tspan> COMPUTER VISION <tspan class="accent-dot">/</tspan> MARWADI UNIVERSITY <tspan class="accent-dot">/</tspan>
    </text>
    <!-- Block 2 (Duplicate for Seamless Loop) -->
    <text x="1000" y="28" class="skill-text">
      PYTHON <tspan class="accent-dot">/</tspan> DATA SCIENCE <tspan class="accent-dot">/</tspan> DJANGO <tspan class="accent-dot">/</tspan> FLASK <tspan class="accent-dot">/</tspan> MACHINE LEARNING <tspan class="accent-dot">/</tspan> SCIKIT-LEARN <tspan class="accent-dot">/</tspan> PANDAS <tspan class="accent-dot">/</tspan> NUMPY <tspan class="accent-dot">/</tspan> POSTGRESQL <tspan class="accent-dot">/</tspan> MYSQL <tspan class="accent-dot">/</tspan> REST APIS <tspan class="accent-dot">/</tspan> COMPUTER VISION <tspan class="accent-dot">/</tspan> MARWADI UNIVERSITY <tspan class="accent-dot">/</tspan>
    </text>
  </g>

  <!-- Edge Fade Overlays -->
  <rect x="1" y="1" width="898" height="46" rx="8" fill="url(#fadeMask)" pointer-events="none" />
</svg>

