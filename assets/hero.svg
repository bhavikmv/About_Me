<svg width="100%" height="280" viewBox="0 0 900 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="hudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090E" />
      <stop offset="50%" stop-color="#0B1120" />
      <stop offset="100%" stop-color="#05070A" />
    </linearGradient>

    <!-- Glowing Cyber Blue Gradient -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Top Laser Sweep Gradient -->
    <linearGradient id="laserSweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="1" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </linearGradient>

    <!-- Particle Glow -->
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    /* Unique Terminal & HUD Animations */
    .hud-laser {
      animation: sweepLaser 5s ease-in-out infinite;
    }
    .status-blinker {
      animation: statusPulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    .telemetry-node {
      animation: telemetryBreathe 3.5s ease-in-out infinite alternate;
    }
    .cursor-blink {
      animation: cursorBlink 1s step-start infinite;
    }
    .line-flow {
      stroke-dasharray: 6 6;
      animation: flowDash 20s linear infinite;
    }
    .packet-move {
      animation: packetTravel 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes sweepLaser {
      0% { transform: translateX(-300px); opacity: 0; }
      20% { opacity: 0.9; }
      80% { opacity: 0.9; }
      100% { transform: translateX(950px); opacity: 0; }
    }
    @keyframes statusPulse {
      0%, 100% { opacity: 0.3; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.1); }
    }
    @keyframes telemetryBreathe {
      0% { opacity: 0.25; }
      100% { opacity: 0.85; }
    }
    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes flowDash {
      to { stroke-dashoffset: -100; }
    }
    @keyframes packetTravel {
      0% { cx: 700; cy: 190; opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { cx: 860; cy: 90; opacity: 0; }
    }

    .mono-title {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 700;
      font-size: 27px;
      letter-spacing: 6px;
      fill: #F8FAFC;
    }
    .mono-sub {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 500;
      font-size: 13px;
      letter-spacing: 1.8px;
      fill: #38BDF8;
    }
    .mono-detail {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 400;
      font-size: 12px;
      letter-spacing: 0.8px;
      fill: #94A3B8;
    }
    .terminal-bar {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      letter-spacing: 1.2px;
      fill: #64748B;
    }
  </style>

  <!-- Container Box -->
  <rect x="1" y="1" width="898" height="278" rx="12" fill="url(#hudBg)" stroke="#1E293B" stroke-width="1.2" />

  <!-- Window Header Bar -->
  <rect x="1" y="1" width="898" height="36" rx="12" fill="#0C1322" />
  <rect x="1" y="24" width="898" height="13" fill="#0C1322" />
  <line x1="1" y1="37" x2="899" y2="37" stroke="#1E293B" stroke-width="1" />

  <!-- Terminal Window Controls -->
  <circle cx="22" cy="18" r="4.5" fill="#EF4444" opacity="0.8" />
  <circle cx="38" cy="18" r="4.5" fill="#F59E0B" opacity="0.8" />
  <circle cx="54" cy="18" r="4.5" fill="#10B981" opacity="0.8" />

  <!-- Window Title -->
  <text x="450" y="22" class="terminal-bar" text-anchor="middle">BHAVIK_VASAVADA // M.SC DATA SCIENCE @ MARWADI UNIVERSITY</text>

  <!-- Animated Laser Sweep on Header -->
  <rect x="0" y="36" width="220" height="1.8" fill="url(#laserSweep)" class="hud-laser" />

  <!-- Left Side: Interactive Circuit Grid -->
  <g class="telemetry-node" stroke="#1E293B" stroke-width="1">
    <line x1="40" y1="80" x2="160" y2="80" class="line-flow" />
    <line x1="160" y1="80" x2="200" y2="130" />
    <line x1="200" y1="130" x2="200" y2="210" class="line-flow" />
    <line x1="200" y1="210" x2="80" y2="210" />
    <line x1="80" y1="210" x2="40" y2="160" />
    <line x1="40" y1="160" x2="40" y2="80" />
  </g>
  <g fill="#38BDF8">
    <circle cx="40" cy="80" r="3" />
    <circle cx="160" cy="80" r="2.5" />
    <circle cx="200" cy="130" r="3.5" fill="#818CF8" />
    <circle cx="200" cy="210" r="3" />
    <circle cx="80" cy="210" r="2.5" />
    <circle cx="40" cy="160" r="2.5" />
  </g>

  <!-- Right Side: Neural Network Cluster -->
  <g class="telemetry-node" stroke="#1E293B" stroke-width="1">
    <line x1="700" y1="190" x2="780" y2="140" />
    <line x1="780" y1="140" x2="860" y2="90" />
    <line x1="780" y1="140" x2="840" y2="210" />
    <line x1="860" y1="90" x2="840" y2="210" />
    <line x1="700" y1="190" x2="750" y2="240" />
    <line x1="750" y1="240" x2="840" y2="210" />
  </g>
  <g fill="#38BDF8">
    <circle cx="700" cy="190" r="3.5" />
    <circle cx="780" cy="140" r="4" fill="#818CF8" />
    <circle cx="860" cy="90" r="3" />
    <circle cx="840" cy="210" r="3.5" />
    <circle cx="750" cy="240" r="2.5" />
  </g>
  <!-- Animated Data Packet flowing across nodes -->
  <circle cx="700" cy="190" r="3" fill="#38BDF8" class="packet-move" />

  <!-- Center Content: Developer Profile Identity -->
  <g transform="translate(450, 0)" text-anchor="middle">
    <!-- Subtitle Flag -->
    <text x="0" y="82" class="mono-sub">&lt;SYSTEM / ACTIVE DEVELOPER&gt;</text>

    <!-- Main Name -->
    <text x="0" y="122" class="mono-title">BHAVIK VASAVADA</text>

    <!-- Specialization -->
    <text x="0" y="156" class="mono-sub">PYTHON BACKEND DEVELOPER &amp; DATA SCIENCE SCHOLAR</text>

    <!-- Institutional Baseline -->
    <text x="0" y="186" class="mono-detail">M.Sc. Data Science · Marwadi University  |  BCA (2023–2026)</text>

    <!-- Status Console Pill -->
    <g transform="translate(0, 212)">
      <rect x="-210" y="0" width="420" height="34" rx="8" fill="#060911" stroke="#1E293B" stroke-width="1.2" />
      <circle cx="-185" cy="17" r="4.5" fill="#10B981" class="status-blinker" />
      <text x="-165" y="21.5" class="mono-detail" text-anchor="start" fill="#E2E8F0">
        Status: Building Backend Systems &amp; Data Models<tspan class="cursor-blink" fill="#38BDF8"> _</tspan>
      </text>
    </g>
  </g>
</svg>

